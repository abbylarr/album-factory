[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "album-factory-core"
version = "0.1.0"
description = "Local common-class album planning and proof export"
requires-python = ">=3.11"
dependencies = ["Pillow>=10,<13", "reportlab>=4,<5"]

[project.optional-dependencies]
test = ["pypdf>=5,<7"]
web = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "opencv-python-headless>=4.10,<5", "numpy>=1.26,<3", "httpx>=0.27,<1"]

[project.scripts]
album-factory = "album_factory.cli:main"

[tool.setuptools.packages.find]
include = ["album_factory*"]
