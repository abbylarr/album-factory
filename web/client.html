<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Личный кабинет — Фабрика альбомов</title><link rel="icon" href="/static/assets/logo.svg"><link rel="stylesheet" href="/static/client.css"><script src="/static/client.js" defer></script></head><body><header><a href="#" class="brand"><img src="/static/assets/logo.svg" alt=""><span>ФАБРИКА<br>АЛЬБОМОВ</span></a><span class="account">Личный кабинет</span></header><main id="main" tabindex="-1"><p>Загружаем ваш заказ…</p></main><dialog id="selection"><form id="selection-form"><div class="dialog-head"><span>Портрет для альбома</span><button type="button" id="close" aria-label="Закрыть">×</button></div><div class="editor"><img id="preview" alt="Выбранный портрет"><div><h2>Как вас подписать?</h2><p class="muted">Эти данные появятся в вашем альбоме.</p><label>Имя<input name="first_name" autocomplete="given-name" maxlength="50" required></label><label>Фамилия<input name="last_name" autocomplete="family-name" maxlength="50" required></label><label>Цитата <span class="muted">· необязательно</span><textarea name="quote" maxlength="300" rows="3" placeholder="Слова, которые хочется сохранить"></textarea></label><small id="characters">0 / 300</small><p id="error" role="alert"></p><button class="primary" type="submit">Выбрать и сохранить</button><p class="fine">Вы сможете изменить свой выбор позже.</p></div></div></form></dialog><div id="notice" role="status" aria-live="polite"></div></body></html>
