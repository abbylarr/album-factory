<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f6f3"><title>Личный кабинет — Фабрика альбомов</title><link rel="icon" href="/static/assets/logo.svg"><link rel="stylesheet" href="/static/client.css?v=teachers-2"><script src="/static/client.js?v=teachers-2" defer></script></head><body>
<main id="main" tabindex="-1"><p class="loading">Загружаем ваш заказ…</p></main>
<dialog id="selection" class="sheet"><form id="selection-form"><div class="sheet-head"><span>Портрет для альбома</span><button type="button" class="icon-btn" id="close" aria-label="Закрыть">×</button></div><div class="editor"><img id="preview" alt="Выбранный портрет"><div><h2>Как вас подписать?</h2><p class="muted">Эти данные появятся в вашем альбоме.</p><label>Имя<input name="first_name" autocomplete="given-name" maxlength="50" required></label><label>Фамилия<input name="last_name" autocomplete="family-name" maxlength="50" required></label><label>Цитата <span class="muted">· необязательно</span><textarea name="quote" rows="3" placeholder="Слова, которые хочется сохранить"></textarea></label><small id="characters">0 / 0</small><p id="error" class="error" role="alert"></p><button class="primary" type="submit">Отправить анкету</button><p class="fine">После отправки портрет изменить нельзя.</p></div></div></form></dialog>
<dialog id="zoom" class="zoom" aria-label="Разворот крупно"><div class="zoom-head"><span id="zoom-count"></span><button type="button" class="icon-btn light" id="zoom-close" aria-label="Закрыть">×</button></div><div class="zoom-stage" id="zoom-stage"></div><p class="zoom-hint">Поверните телефон, чтобы рассмотреть детали</p><div class="zoom-foot"><button type="button" class="icon-btn light" id="zoom-prev" aria-label="Предыдущий разворот">‹</button><a class="zoom-fix" id="zoom-fix" href="#fixes/spread">Нужна правка здесь</a><button type="button" class="icon-btn light" id="zoom-next" aria-label="Следующий разворот">›</button></div></dialog>
<dialog id="teacher-zoom" class="sheet" aria-label="Портрет учителя крупно"><form method="dialog"><button class="icon-btn" aria-label="Закрыть">×</button></form><img id="teacher-zoom-image" alt="Выбранный портрет учителя" style="display:block;max-width:100%;max-height:80vh;margin:auto;object-fit:contain"></dialog>
<dialog id="teacher-sheet" class="sheet narrow-sheet"><form id="teacher-sheet-form" class="form teacher-sheet" novalidate><div id="teacher-sheet-body"></div></form></dialog>
<div id="notice" role="status" aria-live="polite"></div>
</body></html>
