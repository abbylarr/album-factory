<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Album Factory — Заказы</title>
  <link rel="icon" href="/static/assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/style.css"><link rel="stylesheet" href="/static/v2.css">
  <link rel="stylesheet" href="/static/person-picker.css">
  <link rel="stylesheet" href="/static/layout.css">
  <script src="/static/person-picker.js" defer></script>
  <script src="/static/v2.js" defer></script>
  <script src="/static/layout.js" defer></script>
</head>
<body class="v2">
<aside class="sidebar">
  <a class="brand" href="#orders"><img src="/static/assets/logo.svg" alt=""><strong>ALBUM<br>FACTORY</strong></a>
  <nav id="v2-nav" aria-label="Основное меню"></nav>
  <div class="sidebar-bottom"><button class="create-button" data-action="new-order"><span class="plus">＋</span>Создать заказ</button><div class="account"><img src="/static/assets/account.svg" alt=""><span>Фотограф</span><small>Локально</small></div></div>
</aside>
<main id="main" tabindex="-1"></main>
<dialog id="order-dialog" aria-labelledby="dialog-title">
  <form id="order-form">
    <div class="dialog-heading"><h2 id="dialog-title">Создать заказ</h2><button type="button" class="close" data-close="order-dialog" aria-label="Закрыть">×</button></div>
    <p class="muted">Один класс — один общий альбом.</p>
    <label>Школа<input name="school" maxlength="100" placeholder="Например, Школа № 20" required autofocus></label>
    <div class="form-row"><label>Класс<input name="class_name" maxlength="30" placeholder="9 Б" required></label><label>Количество альбомов<input name="copies" type="number" min="1" max="1000" value="20" required></label></div>
    <div class="form-row"><label>Дата съёмки<input name="shoot_date" type="date"></label><label>Цена альбома, ₽<input name="price" type="number" min="0" max="1000000" value="0" required></label></div>
    <p class="muted small">Дату и цену можно оставить незаполненными. После создания можно сразу загрузить портреты.</p>
    <p id="form-error" class="error" role="alert"></p>
    <button class="primary wide" type="submit">Создать заказ</button>
  </form>
</dialog>
<dialog id="person-dialog" aria-labelledby="person-title"><div id="person-content"></div></dialog>
<dialog id="move-dialog" aria-labelledby="move-title"><form id="move-form"><div class="dialog-heading"><h2 id="move-title">Перенести фотографии</h2><button type="button" class="close" data-close="move-dialog" aria-label="Закрыть">×</button></div><div id="person-picker"></div><div class="picker-footer"><button type="button" class="secondary" data-close="move-dialog">Отмена</button><button type="submit" class="primary">Назначить персону</button></div></form></dialog>
<dialog id="action-dialog" aria-label="Действия с заказом"><div id="action-content"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
</body></html>
